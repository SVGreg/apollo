name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  UV_NO_PROGRESS: "1"
  # Unit tests build the default agent config, whose providers refuse an empty key; any
  # non-empty value satisfies the constructors and no request is ever sent.
  GOOGLE_API_KEY: "ci-placeholder"
  ANTHROPIC_API_KEY: "ci-placeholder"

jobs:
  python-quality:
    name: Python 3.12 / macOS 26
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Check public dependency sources before installation
        run: uv run --no-project --python 3.12 python scripts/check_dependency_sources.py

      - name: Install locked development environment
        run: uv sync --dev --locked

      - name: Check Python formatting
        run: uv run ruff format --check .

      - name: Lint Python
        run: uv run ruff check .

      - name: Enforce quality ratchets
        run: uv run python scripts/quality_ratchet.py

      - name: Type-check protected core modules
        run: uv run pyright --project pyright-core.json

      - name: Run deterministic Python tests
        run: >-
          uv run pytest
          tests/unit
          tests/tools
          packages/apollo-client/tests
          -q
          --cov=apollo
          --cov=mcp_server
          --cov=apps/admin_console
          --cov-fail-under=60

      - name: Mock-driver smoke (Flash loop, fake LLM, no device)
        env:
          APOLLO_MOCK_DRIVER: "1"
          APOLLO_FAKE_LLM: "1"
        run: >-
          uv run apollo run "Open Settings and turn on Airplane Mode"
          --profile flash --standalone --device-serial mock-device

      - name: Report simulator runtimes available on the runner
        run: xcrun simctl list runtimes

  simulator-smoke:
    name: iOS Simulator smoke (WDA + fake LLM)
    runs-on: macos-26
    timeout-minutes: 45
    env:
      # Keep the WDA runner bundle cache (downloaded from the pinned manifest) in a known place.
      APOLLO_APP_DIR: ${{ github.workspace }}/.apollo-app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked development environment
        run: uv sync --dev --locked

      - name: Cache the pinned WebDriverAgent runner bundle
        uses: actions/cache@v4
        with:
          path: .apollo-app/runner
          key: wda-runner-${{ runner.arch }}-${{ hashFiles('apollo/resources/runner_manifest.json') }}

      - name: Boot an iPhone simulator on the newest available iOS runtime
        run: uv run python scripts/ci_boot_simulator.py

      - name: Driver smoke (simctl → WDA provisioning → Settings screen → HOME)
        run: >-
          uv run pytest tests/integration/test_ios_simulator_smoke.py
          -m ios_sim -q -o faulthandler_timeout=300

      - name: Flash loop on the simulator with the fake LLM (no model calls)
        env:
          APOLLO_FAKE_LLM: "1"
        run: >-
          uv run apollo run "Open Settings"
          --profile flash --standalone --device-serial "$APOLLO_SIM_UDID"

      - name: Collect simulator diagnostics
        if: failure()
        run: |
          mkdir -p sim-diagnostics
          xcrun simctl io "$APOLLO_SIM_UDID" screenshot sim-diagnostics/screen.png || true
          xcrun simctl listapps "$APOLLO_SIM_UDID" > sim-diagnostics/listapps.plist || true
          xcrun simctl spawn "$APOLLO_SIM_UDID" log show --last 5m --predicate 'process == "WebDriverAgentRunner-Runner"' > sim-diagnostics/wda.log || true
          uv run apollo doctor > sim-diagnostics/doctor.txt || true

      - name: Upload traces and diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-smoke-${{ github.run_id }}
          path: |
            traces
            sim-diagnostics
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/showcase_ui

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: apps/showcase_ui/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build frontend for production
        run: npm run build

  package:
    name: Build and smoke-test Python packages
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: apps/showcase_ui/package-lock.json

      - name: Build frontend assets for the wheel
        run: |
          npm ci --prefix apps/showcase_ui
          npm run build --prefix apps/showcase_ui

      - name: Build client and Apollo distributions
        run: |
          uv build --package apollo-client --wheel --out-dir dist
          uv build --package apollo --wheel --sdist --out-dir dist

      - name: Install wheels in a clean environment
        run: |
          uv venv .smoke-venv --python 3.12
          uv pip install --python .smoke-venv/bin/python dist/apollo_client-*.whl dist/apollo-*.whl

      - name: Smoke-test installed package and CLI
        shell: bash
        run: |
          smoke_dir="$RUNNER_TEMP/apollo-wheel-smoke"
          mkdir -p "$smoke_dir"
          cd "$smoke_dir"
          source "$GITHUB_WORKSPACE/.smoke-venv/bin/activate"
          python - <<'PY'
          from importlib.metadata import files, version

          import apollo
          from apollo.resources import get_bundled_config_path, get_bundled_showcase_dist

          bundled_config = get_bundled_config_path("apollo.jsonc")
          bundled_ui = get_bundled_showcase_dist()
          assert apollo.__version__ == version("apollo")
          assert bundled_config is not None and bundled_config.is_file()
          assert bundled_ui is not None and (bundled_ui / "index.html").is_file()
          assert not any("node_modules" in str(path) for path in (files("apollo") or ()))
          print(f"Installed Apollo {apollo.__version__} with bundled runtime resources")
          PY
          apollo --version
          apollo --help

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7
